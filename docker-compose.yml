services:
  postgres:
    image: postgres:15
    # pg_stat_statements lets the load test count the queries each run sends to Postgres.
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "urlshortener"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local SQS. The init script creates the click-events queue and its dead-letter queue.
  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: path   # queue URLs like http://localstack:4566/000000000000/click-events
    volumes:
      - ./docker/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name click-events"]
      interval: 2s
      timeout: 5s
      retries: 60

  core-api:
    build: ./core-api
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/urlshortener
      DB_USER: postgres
      DB_PASSWORD: postgres
      BASE_URL: http://localhost:8080
      REDIS_HOST: redis
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      RATE_LIMIT_CREATE_PER_MINUTE: ${RATE_LIMIT_CREATE_PER_MINUTE:-10}
      RATE_LIMIT_REDIRECT_PER_MINUTE: ${RATE_LIMIT_REDIRECT_PER_MINUTE:-100}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}   # enables DELETE /api/v1/urls/{code}; empty = disabled
      SQS_QUEUE_URL: http://localstack:4566/000000000000/click-events
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test        # LocalStack accepts any credentials
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      localstack: { condition: service_healthy }

  analytics-consumer:
    build: ./analytics-consumer
    ports: ["8081:8081"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/urlshortener
      DB_USER: postgres
      DB_PASSWORD: postgres
      SQS_QUEUE_URL: http://localstack:4566/000000000000/click-events
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }

  # Load generator. Runs inside the compose network so requests skip Docker Desktop's port forwarding.
  # Usage: see loadtest/run-bench.sh
  k6:
    image: grafana/k6:0.54.0
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/scripts:ro
      - ./loadtest/results:/results

volumes:
  postgres_data:
